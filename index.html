<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosko TV Oficina</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }
       #kiosk-video {
            display: none;
            width: 100vw;
            height: 100vh;
            object-fit: fill;
        }
        #start-btn {
            padding: 20px 40px;
            font-size: 24px;
            cursor: pointer;
            background-color: #8B4513;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
        }
        #loading-text {
            color: white;
            font-size: 20px;
            display: none;
            position: absolute;
        }
    </style>
</head>
<body>

    <!-- Botón para iniciar la pantalla -->
    <button id="start-btn">Iniciar Pantalla</button>
    <div id="loading-text">Cargando video...</div>

    <!-- Video conectado a Google Drive con enlace directo -->
    <video id="kiosk-video" src="https://drive.google.com/uc?export=download&id=1RMOIUA1Nohlk09K851mDxsDg1rKlk8O2" loop playsinline muted preload="auto"></video>

    <script>
        const btn = document.getElementById('start-btn');
        const video = document.getElementById('kiosk-video');
        const loadingText = document.getElementById('loading-text');

        btn.addEventListener('click', () => {
            // Oculta el botón y muestra el texto de carga
            btn.style.display = 'none';
            loadingText.style.display = 'block';
            
            // Forzar la carga del video
            video.load();
        });

        // Se ejecuta cuando el video ya tiene datos suficientes para reproducirse fluido
        video.addEventListener('canplaythrough', () => {
            loadingText.style.display = 'none';
            video.style.display = 'block';
            
            // Inicia la reproducción sin forzar pantalla completa por código
            video.play().catch(error => {
                console.error("Error al reproducir:", error);
                alert("Error al reproducir: " + error.message);
            });
        });

        // Por si ocurre algún error descargando desde la TV
        video.addEventListener('error', (e) => {
            loadingText.style.display = 'none';
            alert("No se pudo cargar el video desde Google Drive. Revisa los permisos del enlace.");
            btn.style.display = 'block';
        });
    </script>
</body>
</html>
