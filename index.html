<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosko TV Oficina</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }
        /* Contenedor del reproductor de Archive.org */
        #kiosk-container {
            display: none;
            width: 100vw;
            height: 100vh;
        }
        #kiosk-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #start-btn {
            padding: 20px 40px;
            font-size: 24px;
            cursor: pointer;
            background-color: #8B4513; /* Color café estilo Coffee Bar */
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Botón para iniciar la pantalla -->
    <button id="start-btn">Iniciar Pantalla</button>

    <!-- Contenedor con tu iframe de Archive.org -->
    <div id="kiosk-container">
        <iframe src="https://archive.org/embed/video_20260917" frameborder="0" webkitallowfullscreen="true" mozallowfullscreen="true" allowfullscreen></iframe>
    </div>

    <script>
        const btn = document.getElementById('start-btn');
        const container = document.getElementById('kiosk-container');

        btn.addEventListener('click', () => {
            // Oculta el botón y muestra el video embebido
            btn.style.display = 'none';
            container.style.display = 'block';
            
            // Intenta poner la página en pantalla completa de forma segura
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            }
        });
    </script>
</body>
</html>
